<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JARVIS TV</title>
<style>
:root{--bg:#02060d;--ln:#0e4155;--c:#00e5ff;--t:#d6f6ff;--m:#6f9aab;--ok:#19ff9c;--bad:#ff3b4e;--fit:cover}
*{box-sizing:border-box;margin:0}[hidden]{display:none!important}
html,body{height:100%;background:var(--bg);color:var(--t);font:18px/1.35 system-ui,Roboto,sans-serif;overflow:hidden}
button,input{font:inherit;color:inherit}
button{background:#0b2230;border:2px solid var(--ln);border-radius:12px;padding:10px 20px;cursor:pointer}
:focus{outline:none}
button:focus,.tile:focus,label.chk:focus-within{border-color:var(--c);box-shadow:0 0 0 4px #00e5ff55}
button.pri{background:#06485a;border-color:var(--c)}
#app{display:flex;flex-direction:column;height:100%}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:14px 22px}
h1{font:800 26px system-ui;letter-spacing:.3em;color:var(--c)}
#info{color:var(--m);flex:1;min-width:180px}
#grid{flex:1;overflow:auto;padding:8px 22px 24px;display:grid;gap:14px;align-content:start;align-items:start}
.tile{position:relative;background:#000;border:2px solid var(--ln);border-radius:12px;overflow:hidden}
.tile::before{content:"";display:block;padding-top:calc(100% / var(--ar,1.7778))}
.tile img,.tile video-stream,.tile iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
.tile img{object-fit:var(--fit)}
.tile video-stream video{display:block;width:100%!important;height:100%!important;max-width:none!important;max-height:none!important;pointer-events:none;background:#000}
.tile video-stream .info{display:none}
.nm{position:absolute;left:10px;bottom:8px;background:#000b;padding:2px 10px;border-radius:6px;z-index:2;pointer-events:none}
.empty{grid-column:1/-1;text-align:center;color:var(--m);padding:60px 0}
/* tela cheia de uma câmera */
#viewer,#rwall{position:fixed;inset:0;background:#000;z-index:50;display:none}
#viewer.on,#rwall.on{display:block}
#vstage{position:absolute;inset:0}#vstage video-stream{position:absolute;inset:0;display:block}
#vstage video-stream video{display:block;width:100%!important;height:100%!important;max-width:none!important;max-height:none!important;pointer-events:none;background:#000}
#vstage video-stream .info{display:none}
.hud{position:absolute;left:0;right:0;bottom:0;padding:18px 28px;background:linear-gradient(#0000,#000d);display:flex;gap:18px;flex-wrap:wrap;align-items:baseline;transition:opacity .4s;z-index:5;pointer-events:none}
.hud b{font-size:26px}.hud span{color:var(--m)}
.idle .hud,.idle #rtop{opacity:0}
/* ronda */
#rtop{position:absolute;top:0;left:0;right:0;padding:14px 24px;background:linear-gradient(#000d,#0000);z-index:5;display:flex;gap:18px;transition:opacity .4s;pointer-events:none}
#rtop b{color:var(--c)}#rtop span{color:var(--m)}
#rbar{position:absolute;top:0;left:0;right:0;height:4px;z-index:6;background:#0e415566}#rprog{display:block;height:100%;width:0;background:var(--c)}
#rgrid{position:absolute;inset:0;padding:4px;gap:4px;display:grid}
#rgrid .tile{height:100%;border-color:#0e4155;border-radius:8px}
#rgrid .tile::before{display:none}
dialog{background:#06141d;color:var(--t);border:2px solid var(--c);border-radius:16px;padding:24px;width:min(760px,94vw);max-height:92vh;overflow:auto;margin:auto}
dialog::backdrop{background:#000c}
dialog h2{color:var(--c);letter-spacing:.2em;font-size:20px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0;align-items:center}
.lab{color:var(--m);font-size:14px;letter-spacing:.12em;text-transform:uppercase;margin-top:14px}
label.chk{display:flex;align-items:center;gap:12px;border:2px solid var(--ln);border-radius:10px;padding:8px 14px;margin-top:6px;background:#04101a}
input[type=checkbox]{width:22px;height:22px}
.step{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:2px solid var(--ln);border-radius:10px;padding:8px 12px;margin-top:6px;background:#04101a}
.step b.v{min-width:64px;text-align:center}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#06141d;border:2px solid var(--c);padding:10px 22px;border-radius:12px;z-index:200}
</style></head><body>
<div id="app">
 <header><h1>JARVIS</h1><span id="info">Conectando…</span>
  <button id="bGrade"></button><button id="bCols"></button><button id="bFit"></button><button id="bRonda" class="pri">Ronda</button><button id="bRef">Atualizar</button></header>
 <div id="grid"></div>
</div>
<div id="viewer"><div id="vstage"></div><div class="hud"><b id="vinfo"></b><span>◄ ► trocar câmera · ▲ HD · ▼ SD · OK fechar</span></div></div>
<div id="rwall"><div id="rbar"><i id="rprog"></i></div><div id="rtop"><b>RONDA</b><span id="rinfo"></span></div><div id="rgrid"></div><div class="hud"><span id="rstate">◄ ► anterior / próxima · OK pausar · Voltar sair</span></div></div>
<dialog id="rdlg"><h2>RONDA AUTOMÁTICA</h2>
 <div class="lab">Câmeras da ronda</div>
 <div class="row"><button data-sel="all">Todas</button><button data-sel="none">Nenhuma</button></div>
 <div id="rcams"></div>
 <div class="lab">Sequência (N câmeras por X segundos; ao final recomeça)</div>
 <div class="row"><button data-rp="1">Só 1</button><button data-rp="4">Só 4</button><button data-rp="6">Só 6</button><button data-rp="seq">1 → 4 → 6</button></div>
 <div id="rsteps"></div>
 <div class="row"><button id="radd">+ Etapa</button></div>
 <div class="row" style="justify-content:flex-end"><button id="rcancel">Cancelar</button><button id="rstart" class="pri">Iniciar ronda</button></div></dialog>
<div id="toast" hidden></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],sleep=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS={get:(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch{return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const FITS=[['auto','Auto'],['cover','Preencher'],['fill','Esticar']],COLS=[0,2,3,4,5,6],RN=[1,2,3,4,6,8,9,12];
let cams=[],cfg={grid:'img',cols:0,fit:'auto',...LS.get('cfg',{})},rcfg=LS.get('ronda',{ids:null,steps:[{n:4,sec:10}]}),ratios={},vi=-1,quality=LS.get('q','hd'),ronda=null,sig='',busy=false,booted=false,firstFocus=true;
if(!FITS.some(f=>f[0]===cfg.fit))cfg.fit='auto';
const toast=t=>{const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,3500)};
const modal=()=>vi>=0||!!ronda||$$('dialog').some(d=>d.open);
const pretty=n=>n.replace(/[_\-]+/g,' ').trim().replace(/\b\p{L}/gu,c=>c.toUpperCase());
// ---------- lista de câmeras (streams do go2rtc); "X_sub" vira o SD de "X"
function groupStreams(names){const set=new Set(names),subOf={},base=n=>{const m=n.match(/^(.*?)[_\-. ]?(sub|sd|low|baixa|substream)$/i);return m&&set.has(m[1])?m[1]:null};
 names.forEach(n=>{const b=base(n);if(b)subOf[b]=n});
 return names.filter(n=>!base(n)).map(n=>({id:n,name:pretty(n),hd:n,sd:subOf[n]||null}))}
async function loadStreams(){const r=await fetch('/api/streams',{cache:'no-store'});if(!r.ok)throw new Error(r.status);
 const names=Object.keys(await r.json()).sort((a,b)=>a.localeCompare(b,'pt',{numeric:true}));return groupStreams(names)}
async function refresh(){try{const l=await loadStreams(),s=JSON.stringify(l.map(c=>[c.id,c.sd]));
  if(s!==sig&&!modal()){sig=s;cams=l;renderGrid()}else if(s!==sig){cams=l;sig=s}
  $('#info').textContent=`${cams.length} câmeras · ${location.host}`}
 catch{$('#info').textContent=`Sem conexão com ${location.host} · tentando de novo…`}
 if(!booted&&cams.length){booted=true;if(location.hash==='#ronda')rStart()}}
// ---------- player (video-stream do go2rtc, mesma origem => sem CORS)
let vsReady=null;const vsLoad=()=>vsReady||(vsReady=import('/video-stream.js').catch(e=>{vsReady=null;throw e}));
async function mountVS(el,name){if(!el)return;
 try{await vsLoad()}catch{el.outerHTML=`<iframe allow="autoplay;fullscreen" src="/stream.html?src=${encodeURIComponent(name)}&mode=webrtc,mse"></iframe>`;return}
 el.mode='webrtc,mse';el.CODECS=(el.CODECS||[]).filter(c=>!/^(hvc1|hev1)/.test(c));   // nunca pede H.265: o go2rtc usa/gera H.264
 el.src=(location.protocol==='https:'?'wss://':'ws://')+location.host+'/api/ws?src='+encodeURIComponent(name)}
function setRatio(el,w,h){const t=el.closest('[data-id]');if(!t||!w||!h)return;const id=t.dataset.id,r=w/h;
 if(Math.abs((ratios[id]||0)-r)>.01){ratios[id]=r;if(ronda)layoutR();else if(t.closest('#grid')&&cfg.fit==='auto')t.style.setProperty('--ar',r)}}
function fitFor(el,v){if(cfg.fit!=='auto')return cfg.fit;const b=el.getBoundingClientRect(),r=v.videoWidth/v.videoHeight;
 return(!r||!b.width||!b.height)?'cover':Math.abs(Math.log((b.width/b.height)/r))<.79?'cover':'contain'}
setInterval(()=>$$('video-stream').forEach(el=>{const v=el.video||el.querySelector('video');if(!v)return;v.controls=false;v.muted=true;
 const s=v.style;s.setProperty('object-fit',fitFor(el,v),'important');s.setProperty('pointer-events','none','important');if(v.videoWidth)setRatio(el,v.videoWidth,v.videoHeight)}),800);
// ---------- grade
function btnLabels(){$('#bGrade').textContent='Grade: '+(cfg.grid==='img'?'Imagens':'Vídeo');$('#bCols').textContent='Colunas: '+(cfg.cols||'Auto');$('#bFit').textContent='Imagem: '+FITS.find(f=>f[0]===cfg.fit)[1];
 document.documentElement.style.setProperty('--fit',cfg.fit==='fill'?'fill':'cover')}
function renderGrid(){const g=$('#grid');g.style.gridTemplateColumns=cfg.cols?`repeat(${cfg.cols},minmax(0,1fr))`:'repeat(auto-fill,minmax(300px,1fr))';
 g.innerHTML=cams.length?cams.map((c,i)=>`<div class="tile" tabindex="0" data-i="${i}" data-id="${esc(c.id)}">${cfg.grid==='img'?'<img alt="" data-n="'+esc(c.sd||c.hd)+'">':'<video-stream></video-stream>'}<span class="nm">${esc(c.name)}</span></div>`).join(''):'<p class="empty">Nenhuma câmera encontrada no go2rtc</p>';
 if(cfg.grid!=='img')$$('#grid .tile').forEach((t,i)=>mountVS(t.querySelector('video-stream'),cams[i].sd||cams[i].hd));
 $$('#grid .tile').forEach(t=>{const r=ratios[t.dataset.id];if(r&&cfg.fit==='auto')t.style.setProperty('--ar',r)});
 if(firstFocus&&cams.length){firstFocus=false;const f=$('#grid .tile');if(f)f.focus()}
 snaps()}
const inView=el=>{const r=el.getBoundingClientRect();return r.bottom>0&&r.top<innerHeight}; // só atualiza o que está visível
async function snaps(){if(busy)return;busy=true;
 try{while(cfg.grid==='img'&&!modal()){const imgs=$$('#grid img').filter(inView);let i=0;
  await Promise.all([0,1,2].map(async()=>{while(i<imgs.length&&!modal()){const im=imgs[i++];await new Promise(res=>{const p=new Image();
   p.onload=()=>{im.src=p.src;setRatio(im,p.naturalWidth,p.naturalHeight);res()};p.onerror=res;p.src=`/api/frame.jpeg?src=${encodeURIComponent(im.dataset.n)}&t=${Date.now()}`})}}));
  await sleep(1500)}}finally{busy=false}}
const save=()=>{LS.set('cfg',cfg);btnLabels()};
$('#bGrade').onclick=()=>{cfg.grid=cfg.grid==='img'?'vid':'img';save();renderGrid();$('#bGrade').focus()};
$('#bCols').onclick=()=>{cfg.cols=COLS[(COLS.indexOf(cfg.cols)+1)%COLS.length];save();renderGrid();$('#bCols').focus()};
$('#bFit').onclick=()=>{cfg.fit=FITS[(FITS.findIndex(f=>f[0]===cfg.fit)+1)%FITS.length][0];save();$$('#grid .tile').forEach(t=>{const r=ratios[t.dataset.id];t.style.setProperty('--ar',(cfg.fit==='auto'&&r)?r:'')});if(ronda)layoutR();$('#bFit').focus()};
$('#bRef').onclick=()=>{refresh();toast('Lista atualizada')};
$('#grid').onclick=e=>{const t=e.target.closest('.tile');if(t)openViewer(+t.dataset.i)};
// ---------- câmera em tela cheia (◄ ► troca · ▲ HD · ▼ SD · OK fecha)
const streamName=c=>quality==='sd'&&c.sd?c.sd:c.hd;
function showViewer(){const c=cams[vi];$('#vstage').innerHTML='<video-stream></video-stream>';mountVS($('#vstage video-stream'),streamName(c));
 $('#vstage').dataset.id=c.id;$('#vinfo').textContent=`${vi+1}/${cams.length} · ${c.name} · ${quality==='sd'&&c.sd?'SD':'HD'}`;flash('#viewer')}
function openViewer(i){if(!cams[i])return;vi=i;$('#grid').innerHTML='';$('#viewer').classList.add('on');showViewer()}
function closeViewer(){const i=vi;vi=-1;$('#viewer').classList.remove('on');$('#vstage').innerHTML='';renderGrid();const t=$(`#grid .tile[data-i="${i}"]`);if(t)t.focus()}
const vGo=d=>{vi=(vi+d+cams.length)%cams.length;showViewer()},setQ=q=>{quality=q;LS.set('q',q);showViewer()};
$('#viewer').onclick=closeViewer;
let idleT;function flash(sel){const e=$(sel);e.classList.remove('idle');clearTimeout(idleT);idleT=setTimeout(()=>e.classList.add('idle'),4000)}
// ---------- ronda
const gcd=(a,b)=>b?gcd(b,a%b):a,lcm=(a,b)=>a/gcd(a,b)*b;
function layoutR(){const g=$('#rgrid'),kids=[...g.children],n=kids.length||1,W=g.clientWidth-8,H=g.clientHeight-8;
 const rs=Object.values(ratios).filter(x=>x>.3&&x<4).sort((a,b)=>a-b),ar=cfg.fit==='auto'&&rs.length?rs[rs.length>>1]:16/9;
 let c=1,bs=1e9;for(let k=1;k<=n;k++){const r=Math.ceil(n/k),m=n-(r-1)*k,d=Math.max(Math.abs(Math.log((W/k)/(H/r)/ar)),Math.abs(Math.log((W/m)/(H/r)/ar)));if(d<bs+.01&&(d<bs-.01||k>c)){bs=Math.min(bs,d);c=k}}   // (empate: prefere mais colunas, melhor em TV) pior célula (inclusive a última linha) mais parecida com a câmera => menos corte
 const r=Math.ceil(n/c),m=n-(r-1)*c,L=lcm(c,m);
 g.style.gridTemplateColumns=`repeat(${L},minmax(0,1fr))`;g.style.gridTemplateRows=`repeat(${r},minmax(0,1fr))`;
 kids.forEach((k,i)=>{k.style.gridColumn='span '+(i<(r-1)*c?L/c:L/m)})}
function rShow(){const R=ronda,st=R.steps[R.si],pool=cams.filter(c=>R.ids.includes(c.id));R.hist.push({si:R.si,pos:R.pos});if(R.hist.length>60)R.hist.shift();
 const k=Math.min(st.n,pool.length);R.cur=[];for(let i=0;i<k;i++)R.cur.push(pool[(R.pos+i)%pool.length]);R.pos=pool.length?(R.pos+k)%pool.length:0;
 R.t0=Date.now();R.last=R.t0;R.dur=st.sec*1000;
 $('#rgrid').innerHTML=R.cur.map(c=>`<div class="tile" data-id="${esc(c.id)}"><video-stream></video-stream><span class="nm">${esc(c.name)}</span></div>`).join('');
 $$('#rgrid .tile').forEach((t,i)=>{const c=R.cur[i];mountVS(t.querySelector('video-stream'),k>1&&c.sd?c.sd:c.hd)});   // várias câmeras: usa o SD (mais leve); uma só: HD
 layoutR();$('#rinfo').textContent=`etapa ${R.si+1}/${R.steps.length} · ${st.n} ${st.n>1?'câmeras':'câmera'} · ${st.sec}s${R.paused?' · PAUSADA':''}`;$('#rprog').style.width='0'}
const rNext=()=>{if(!ronda)return;ronda.si=(ronda.si+1)%ronda.steps.length;rShow();flash('#rwall')};
function rPrev(){if(!ronda)return;const h=ronda.hist,cur=h.pop(),prev=h.pop()||cur;if(prev){ronda.si=prev.si;ronda.pos=prev.pos}rShow();flash('#rwall')}
function togglePause(){if(!ronda)return;ronda.paused=!ronda.paused;$('#rstate').textContent=ronda.paused?'PAUSADA · OK retoma · ◄ ► anterior / próxima · Voltar sai':'◄ ► anterior / próxima · OK pausar · Voltar sair';flash('#rwall')}
function rStart(){const ids=(rcfg.ids||cams.map(c=>c.id)).filter(id=>cams.some(c=>c.id===id));if(!ids.length)return toast('Marque ao menos uma câmera');
 rcfg.steps.forEach(s=>{s.sec=Math.max(3,+s.sec||10)});LS.set('ronda',rcfg);closeDlg();
 ronda={ids,steps:rcfg.steps.map(s=>({...s})),si:0,pos:0,cur:[],hist:[],paused:false,t0:0,last:0,dur:1};
 $('#grid').innerHTML='';$('#rwall').classList.add('on');$('#rstate').textContent='◄ ► anterior / próxima · OK pausar · Voltar sair';rShow();flash('#rwall')}
function stopRonda(){ronda=null;$('#rwall').classList.remove('on');$('#rgrid').innerHTML='';renderGrid();$('#bRonda').focus()}
setInterval(()=>{if(!ronda)return;const n=Date.now();if(ronda.paused)ronda.t0+=n-ronda.last;ronda.last=n;const f=Math.min(1,(n-ronda.t0)/ronda.dur);$('#rprog').style.width=(f*100)+'%';if(f>=1)rNext()},250);
addEventListener('resize',()=>ronda&&layoutR());$('#rwall').onclick=()=>{if(ronda)togglePause()};
// ---- diálogo da ronda
const closeDlg=()=>{const d=$('#rdlg');if(d.open)d.close()};
function renderR(){const ids=new Set(rcfg.ids||cams.map(c=>c.id));
 $('#rcams').innerHTML=cams.map(c=>`<label class="chk"><input type="checkbox" data-c="${esc(c.id)}" ${ids.has(c.id)?'checked':''}>${esc(c.name)}${c.sd?' <small style="color:var(--m)">(HD+SD)</small>':''}</label>`).join('');
 $('#rsteps').innerHTML=rcfg.steps.map((s,i)=>`<div class="step"><b>Etapa ${i+1}</b><button data-sn="${i}">${s.n} ${s.n>1?'câmeras':'câmera'}</button><span>por</span><button data-sm="${i}">−</button><b class="v">${s.sec} s</b><button data-sp="${i}">+</button>${rcfg.steps.length>1?`<button data-sd="${i}">Remover</button>`:''}</div>`).join('')}
function openR(){if(!cams.length)return toast('Nenhuma câmera encontrada');if(!rcfg.ids)rcfg.ids=cams.map(c=>c.id);renderR();$('#rdlg').showModal()}
$('#bRonda').onclick=openR;$('#rcancel').onclick=closeDlg;$('#rstart').onclick=rStart;
$('#radd').onclick=()=>{rcfg.steps.push({n:4,sec:10});renderR();$('#radd').focus()};
$('#rdlg').addEventListener('change',e=>{const c=e.target.dataset.c;if(!c)return;const s=new Set(rcfg.ids);e.target.checked?s.add(c):s.delete(c);rcfg.ids=[...s]});
$('#rdlg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset,rf=(k,i)=>{renderR();const n=$(`#rsteps [data-${k}="${i}"]`);if(n)n.focus()};
 if(d.sel){rcfg.ids=d.sel==='all'?cams.map(c=>c.id):[];renderR()}
 if(d.rp){const sec=rcfg.steps[0]?rcfg.steps[0].sec:10;rcfg.steps=d.rp==='seq'?[{n:1,sec},{n:4,sec},{n:6,sec}]:[{n:+d.rp,sec}];renderR()}
 if(d.sn!==undefined){const x=rcfg.steps[+d.sn];x.n=RN[(RN.indexOf(x.n)+1)%RN.length];rf('sn',d.sn)}
 if(d.sm!==undefined){const x=rcfg.steps[+d.sm];x.sec=Math.max(3,x.sec-(x.sec>30?10:5));rf('sm',d.sm)}
 if(d.sp!==undefined){const x=rcfg.steps[+d.sp];x.sec=Math.min(3600,x.sec+(x.sec>=30?10:5));rf('sp',d.sp)}
 if(d.sd!==undefined){rcfg.steps.splice(+d.sd,1);renderR()}});
// ---------- controle remoto: setas navegam, OK abre/fecha
function navTo(dir,root){const all=[...root.querySelectorAll('button,[tabindex="0"],input')].filter(el=>!el.disabled&&!el.closest('[hidden]')&&el.getBoundingClientRect().width>0),cur=document.activeElement;
 if(!cur||!root.contains(cur)||cur===root){if(all[0])all[0].focus();return}
 const a=cur.getBoundingClientRect(),ax=a.left+a.width/2,ay=a.top+a.height/2,hz=dir==='L'||dir==='R';let best=null,bs=1e18;
 for(const el of all){if(el===cur)continue;const b=el.getBoundingClientRect(),dx=b.left+b.width/2-ax,dy=b.top+b.height/2-ay;
  if(!(dir==='L'?dx<-4:dir==='R'?dx>4:dir==='U'?dy<-4:dy>4))continue;const sc=(hz?Math.abs(dx):Math.abs(dy))+(hz?Math.abs(dy):Math.abs(dx))*2.2;if(sc<bs){bs=sc;best=el}}
 if(best){best.focus();best.scrollIntoView({block:'nearest',inline:'nearest'})}}
addEventListener('keydown',e=>{const k=e.key,t=e.target,dir={ArrowLeft:'L',ArrowRight:'R',ArrowUp:'U',ArrowDown:'D'}[k],dlg=$$('dialog').find(x=>x.open);
 if(dlg){if(dir){e.preventDefault();navTo(dir,dlg)}else if(k==='Enter'&&t.type==='checkbox'){e.preventDefault();t.click()}return}
 if(ronda){flash('#rwall');if(k==='ArrowLeft'){e.preventDefault();rPrev()}else if(k==='ArrowRight'){e.preventDefault();rNext()}else if(k==='Enter'||k===' '){e.preventDefault();togglePause()}return}
 if(vi>=0){flash('#viewer');if(k==='ArrowLeft'||k==='ArrowRight'){e.preventDefault();vGo(k==='ArrowRight'?1:-1)}else if(k==='ArrowUp'){e.preventDefault();setQ('hd')}else if(k==='ArrowDown'){e.preventDefault();setQ('sd')}else if(k==='Enter'||k===' '){e.preventDefault();closeViewer()}return}
